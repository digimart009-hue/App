name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/3d-car-website-animation-8v41jx
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # Luxury car website is the homepage
          cp car.html _site/index.html
          cp car.html _site/car.html
          # Keep the other pages reachable too
          [ -f index.html ] && cp index.html _site/tools.html || true
          [ -f todo.html ] && cp todo.html _site/todo.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
