<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Smart To-Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #bbb;
            font-size: 1rem;
        }

        /* Input Section */
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            animation: slideUp 0.6s ease;
        }

        .input-section input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .input-section input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-section input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .input-section button {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .input-section button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }

        .input-section button:active {
            transform: scale(0.95);
        }

        /* Filter & Sort Buttons */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            animation: slideUp 0.8s ease;
        }

        .filter-btn, .sort-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #ddd;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .filter-btn:hover, .sort-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: #00f0ff;
            color: #00f0ff;
        }

        .filter-btn.active, .sort-btn.active {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
        }

        /* Stats Bar */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            animation: slideUp 0.9s ease;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .stat h3 {
            font-size: 1.8rem;
            color: #00f0ff;
            margin-bottom: 5px;
        }

        .stat p {
            font-size: 0.8rem;
            color: #aaa;
        }

        /* Tasks List */
        .tasks-section {
            margin-bottom: 30px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: 0.3s;
            animation: slideUp 0.4s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00f0ff;
            transform: translateX(5px);
        }

        .task-item.completed {
            opacity: 0.6;
            background: rgba(0, 240, 255, 0.08);
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        /* Checkbox */
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #00f0ff;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .checkbox:hover {
            background: rgba(0, 240, 255, 0.2);
        }

        .checkbox.checked {
            background: #00f0ff;
            border-color: #00f0ff;
        }

        .checkbox.checked::after {
            content: '✓';
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Task Content */
        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 1rem;
            color: #fff;
            word-break: break-word;
            margin-bottom: 5px;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        .task-priority {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .task-priority.high {
            background: rgba(255, 87, 87, 0.3);
            color: #ff5757;
        }

        .task-priority.medium {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .task-priority.low {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .task-time {
            color: #888;
        }

        /* Task Actions */
        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .task-btn:hover {
            background: rgba(255, 87, 87, 0.3);
            color: #ff5757;
        }

        .task-btn.edit {
            background: rgba(0, 240, 255, 0.2);
        }

        .task-btn.edit:hover {
            background: rgba(0, 240, 255, 0.4);
            color: #00f0ff;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-form input,
        .modal-form textarea,
        .modal-form select {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-family: inherit;
            transition: 0.3s;
        }

        .modal-form input::placeholder,
        .modal-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .modal-form input:focus,
        .modal-form textarea:focus,
        .modal-form select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .modal-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-buttons .save-btn {
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            color: #fff;
        }

        .modal-buttons .save-btn:hover {
            transform: scale(1.02);
        }

        .modal-buttons .cancel-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
        }

        .modal-buttons .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: 1px solid #00f0ff;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 100;
        }

        .theme-toggle:hover {
            background: rgba(0, 240, 255, 0.2);
            transform: scale(1.1);
        }

        /* Light Mode */
        body.light {
            background: linear-gradient(135deg, #f0f0f5, #e8e8f0);
            color: #111;
        }

        body.light .header h1 {
            background: linear-gradient(90deg, #0066cc, #9933ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.light .input-section input {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        body.light .input-section input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        body.light .task-item {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(0, 0, 0, 0.1);
        }

        body.light .task-item:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        body.light .task-text {
            color: #111;
        }

        body.light .stat {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(0, 0, 0, 0.1);
        }

        body.light .filter-btn,
        body.light .sort-btn {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        body.light .filter-btn:hover,
        body.light .sort-btn:hover {
            background: rgba(0, 102, 204, 0.1);
            color: #0066cc;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .input-section {
                flex-direction: column;
            }

            .controls {
                gap: 8px;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .task-actions {
                gap: 4px;
            }

            .task-btn {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌙</button>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>✓ TaskFlow</h1>
            <p>Your personal smart to-do list manager</p>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="handleEnter(event)">
            <button onclick="addTask()">Add Task</button>
        </div>

        <!-- Filter & Sort Controls -->
        <div class="controls">
            <button class="filter-btn active" onclick="filterTasks('all')">All</button>
            <button class="filter-btn" onclick="filterTasks('active')">Active</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
            <button class="sort-btn" onclick="sortTasks('date')">Sort by Date</button>
            <button class="sort-btn" onclick="sortTasks('priority')">Sort by Priority</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <h3 id="totalCount">0</h3>
                <p>Total Tasks</p>
            </div>
            <div class="stat">
                <h3 id="activeCount">0</h3>
                <p>Active</p>
            </div>
            <div class="stat">
                <h3 id="completedCount">0</h3>
                <p>Completed</p>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="tasks-section">
            <div class="tasks-list" id="tasksList"></div>
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>No tasks yet. Add one to get started!</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2>Edit Task</h2>
            <form class="modal-form" onsubmit="saveEdit(event)">
                <input type="text" id="editTaskText" placeholder="Task description" required>
                <textarea id="editTaskDesc" placeholder="Add notes (optional)"></textarea>
                <select id="editTaskPriority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <div class="modal-buttons">
                    <button type="submit" class="save-btn">Save Changes</button>
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let currentSort = 'date';
        let editingTaskId = null;

        // Load tasks on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderTasks();
            updateStats();
        });

        // Add Task
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (!text) {
                alert('Please enter a task!');
                return;
            }

            const task = {
                id: Date.now(),
                text: text,
                description: '',
                priority: 'medium',
                completed: false,
                createdAt: new Date().toLocaleString(),
                completedAt: null
            };

            tasks.unshift(task);
            saveTasks();
            renderTasks();
            input.value = '';
            updateStats();
        }

        // Toggle Task Completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                task.completedAt = task.completed ? new Date().toLocaleString() : null;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        // Delete Task
        function deleteTask(id) {
            if (confirm('Delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        // Open Edit Modal
        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                editingTaskId = id;
                document.getElementById('editTaskText').value = task.text;
                document.getElementById('editTaskDesc').value = task.description;
                document.getElementById('editTaskPriority').value = task.priority;
                document.getElementById('editModal').classList.add('active');
            }
        }

        // Close Edit Modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTaskId = null;
        }

        // Save Edit
        function saveEdit(e) {
            e.preventDefault();
            const task = tasks.find(t => t.id === editingTaskId);
            if (task) {
                task.text = document.getElementById('editTaskText').value;
                task.description = document.getElementById('editTaskDesc').value;
                task.priority = document.getElementById('editTaskPriority').value;
                saveTasks();
                renderTasks();
                updateStats();
                closeEditModal();
            }
        }

        // Filter Tasks
        function filterTasks(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        // Sort Tasks
        function sortTasks(sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        // Render Tasks
        function renderTasks() {
            let filtered = tasks;

            // Apply Filter
            if (currentFilter === 'active') {
                filtered = filtered.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filtered = filtered.filter(t => t.completed);
            }

            // Apply Sort
            if (currentSort === 'priority') {
                const priorityOrder = { high: 0, medium: 1, low: 2 };
                filtered.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
            } else {
                filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }

            // Render
            const tasksList = document.getElementById('tasksList');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                tasksList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            tasksList.innerHTML = filtered.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <div class="task-meta">
                            <span class="task-priority ${task.priority}">${task.priority.toUpperCase()}</span>
                            <span class="task-time">📅 ${task.createdAt}</span>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="task-btn edit" onclick="openEditModal(${task.id})" title="Edit">✏️</button>
                        <button class="task-btn" onclick="deleteTask(${task.id})" title="Delete">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // Update Stats
        function updateStats() {
            const total = tasks.length;
            const active = tasks.filter(t => !t.completed).length;
            const completed = tasks.filter(t => t.completed).length;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('activeCount').innerText = active;
            document.getElementById('completedCount').innerText = completed;
        }

        // Save to Local Storage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Toggle Theme
        function toggleTheme() {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
            updateThemeToggle();
        }

        // Update Theme Toggle Icon
        function updateThemeToggle() {
            const toggle = document.querySelector('.theme-toggle');
            toggle.innerText = document.body.classList.contains('light') ? '☀️' : '🌙';
        }

        // Load Theme Preference
        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.body.classList.add('light');
            }
            updateThemeToggle();
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle Enter Key
        function handleEnter(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        }

        // Close modal on background click
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        // Load on start
        loadTheme();
    </script>
</body>
</html>
